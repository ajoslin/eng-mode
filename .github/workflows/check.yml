name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - run: bun install --frozen-lockfile
      - run: bun run check
